<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Yarn Prototype</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="board"></canvas>

    <header id="topbar">
      <div class="left">
        <label class="level-pick">
          <span id="level-label">–</span>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="level-select" aria-label="Level seç"></select>
        </label>
      </div>
      <div class="right">
        <button id="btn-fullscreen" class="icon" title="Tam ekran" aria-label="Tam ekran">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
        <button id="btn-device" class="icon" title="Mobil / masaüstü görünüm" aria-label="Mobil / masaüstü görünüm">
          <svg class="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
          <svg class="i-desktop" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
        </button>
        <button id="btn-upload" class="icon" title="Bilgisayardan level yükle (PNG)" aria-label="Bilgisayardan level yükle">
          <svg viewBox="0 0 24 24"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/><path d="M12 4v11M7.5 8.5 12 4l4.5 4.5"/></svg>
        </button>
        <button id="btn-sync" class="icon" title="Drive'daki güncel level'ları al" aria-label="Drive'daki güncel level'ları al">
          <svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9"/><path d="M12 11v9M8.5 16.5 12 20l3.5-3.5"/></svg>
        </button>
        <button id="btn-peek" class="icon" title="Resmin aslını göster" aria-label="Resmin aslını göster">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-auto" class="icon" title="Admin: kalan renkleri otomatik tamamla" aria-label="Admin: otomatik tamamla">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7zM13 5l7 7-7 7z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="btn-reset" class="icon" title="Level'ı sıfırla" aria-label="Level'ı sıfırla">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>
        </button>
      </div>
    </header>

    <div id="minimap-wrap"><canvas id="minimap"></canvas><div id="mini-view"></div></div>

    <div id="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2.5h4"/></svg>
      <span id="timer-text">00:00</span><span class="sep"></span><span id="progress-text">0%</span>
    </div>

    <button id="btn-hint" title="İpucu" aria-label="İpucu">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>

    <nav id="palette"></nav>

    <div id="complete" hidden>
      <div class="card">
        <button id="btn-close-complete" class="close" title="Kapat" aria-label="Kapat">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="title">Tamamlandı!</div>
        <div class="time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2.5h4"/></svg><span id="complete-time">00:00</span></div>
        <div class="sub" id="complete-sub"></div>
        <div class="row">
          <button id="btn-replay" class="ghost">Tekrar oyna</button>
          <button id="btn-next">Sonraki level</button>
        </div>
      </div>
    </div>

    <div id="toast" hidden></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
